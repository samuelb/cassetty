name: CI

on:
  push:
    branches: [main]
    # Nothing here feeds the Go build; the Website workflow covers docs/.
    paths-ignore:
      - "docs/**"
      - "**.md"
      - "scripts/demo/**"
      - ".github/workflows/pages.yml"
  pull_request:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "**.md"
      - "scripts/demo/**"
      - ".github/workflows/pages.yml"

# No job publishes anything.
permissions:
  contents: read

jobs:
  test:
    name: Test ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod

      - name: Vet
        run: go vet ./...

      - name: Run tests
        run: go test -v -race ./...

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod

      - name: golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.15.0

      # The run above saw the code for Linux. macOS has its own for the
      # media keys and the folder watcher, and the systems that have
      # neither get the code that stands in for them.
      - name: golangci-lint for macOS and other systems
        run: |
          GOOS=darwin golangci-lint run
          GOOS=windows golangci-lint run

  # The release archives, built the way the Release workflow builds them:
  # all four targets on one macOS runner, which also re-signs the macOS
  # binaries.
  build:
    name: Build release archives
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod

      - name: Build
        run: scripts/release-build.sh "ci-${GITHUB_SHA::7}" "$RUNNER_TEMP/dist"
