name: Website

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: website
  cancel-in-progress: true

# Build and deploy are separate jobs on purpose:
# - "Re-run failed jobs" then only re-runs the deploy, which reuses the one
#   artifact from the build. Re-running a single job that also uploads leaves
#   two "github-pages" artifacts in the run, and deploy-pages refuses those.
# - deploy-pages looks the artifact up exactly once, with no retry, and the
#   artifact list can lag behind a finished upload by a few seconds. A job
#   boundary plus the retries below absorb that lag.
jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # Cloudflare lets browsers keep site.js and site.css for hours but the
      # page for only minutes, so after a deploy a browser could pair the new
      # page with the old script. A content hash in the URL makes every
      # change a new file.
      - name: Stamp asset URLs with their content hash
        run: |
          for f in site.css site.js; do
            hash=$(sha256sum "docs/$f" | cut -c1-10)
            grep -q "\"$f\"" docs/index.html || { echo "::error::docs/index.html does not reference $f"; exit 1; }
            sed -i "s|\"$f\"|\"$f?v=$hash\"|g" docs/index.html
          done
          grep -nE 'site\.(css|js)\?v=' docs/index.html

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: docs

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy-1.outputs.page_url || steps.deploy-2.outputs.page_url || steps.deploy-3.outputs.page_url }}
    steps:
      - id: deploy-1
        continue-on-error: true
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

      - if: steps.deploy-1.outcome == 'failure'
        run: sleep 15

      - id: deploy-2
        if: steps.deploy-1.outcome == 'failure'
        continue-on-error: true
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

      - if: steps.deploy-2.outcome == 'failure'
        run: sleep 45

      - id: deploy-3
        if: steps.deploy-2.outcome == 'failure'
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
